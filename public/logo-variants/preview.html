<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Habiday icon variants</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #161616;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 28px;
        padding: 40px;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      img {
        width: 160px;
        height: 160px;
        border-radius: 36px;
        box-shadow: 0 12px 40px rgb(0 0 0 / 45%);
      }
      .label {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .hint {
        font-size: 12px;
        color: #a3a3a3;
        text-align: center;
        max-width: 140px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="card">
        <img src="./a-week-check.svg" alt="A" />
        <div class="label">A</div>
        <div class="hint">Неделя + галочка</div>
      </div>
      <div class="card">
        <img src="./b-ring-plus.svg" alt="B" />
        <div class="label">B</div>
        <div class="hint">Кольцо прогресса +</div>
      </div>
      <div class="card">
        <img src="./c-monogram.svg" alt="C" />
        <div class="label">C</div>
        <div class="hint">Монограмма h+</div>
      </div>
      <div class="card">
        <img src="./d-streak-flame.svg" alt="D" />
        <div class="label">D</div>
        <div class="hint">Streak / огонь</div>
      </div>
      <div class="card">
        <img src="./e-check-tile.svg" alt="E" />
        <div class="label">E</div>
        <div class="hint">Карточка ✓</div>
      </div>
    </div>
  </body>
</html>
